[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-fitting"
version = "0.1.0"
description = "Spectral line shapes, Beer-Lambert analysis, baseline removal, peak fitting and spectral unmixing"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Luis Rodriguez" }]
requires-python = ">=3.9"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
notebooks = ["matplotlib", "jupyter"]

[tool.setuptools]
packages = ["specfit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
